<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Painel — Federal Conect</title>
<!-- Chart.js (28/09, dashboard de relatórios) — CDN, sem custo/chave. Se
     ficar offline, renderDashboardAvancado() detecta e só pula os gráficos,
     o resto do painel continua normal. -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#2B2050; --bg-2:#372A66; --linha:rgba(155,89,232,0.25);
    --texto:#F3F1FA; --texto-fraco:#BDB0DE; --verde:#3DD9A0; --laranja:#D9922C; --vermelho:#C9573F;
  }
  *{box-sizing:border-box;}
  body{ margin:0; height:100vh; background:var(--bg); color:var(--texto); font-family:'Helvetica Neue',Arial,sans-serif; }

  #login{ display:flex; height:100vh; align-items:center; justify-content:center; flex-direction:column; gap:14px; }
  #login input{ padding:12px 16px; border-radius:8px; border:1px solid var(--linha); background:var(--bg-2); color:var(--texto); width:260px; }
  #login button{ padding:12px 20px; border-radius:8px; border:none; background:var(--verde); color:#0D2B22; font-weight:600; cursor:pointer; }

  #app{ display:none; height:100vh; flex-direction:column; }
  #app.ativo{ display:flex; }

  #abas{ display:flex; gap:4px; padding:10px 14px 0; background:var(--bg-2); border-bottom:1px solid var(--linha); flex-shrink:0; }
  #abas button{ background:none; border:none; color:var(--texto-fraco); padding:10px 16px; font-size:13.5px; font-weight:600; cursor:pointer; border-bottom:2px solid transparent; }
  #abas button.ativa{ color:var(--texto); border-bottom-color:var(--verde); }

  #view-conversas{ flex:1; display:none; grid-template-columns: 340px 1fr; min-height:0; }
  #view-conversas.ativa{ display:grid; }
  #view-relatorios{ flex:1; display:none; overflow-y:auto; padding:26px; }
  #view-relatorios.ativa{ display:block; }

  .cards-metricas{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:28px; }
  .card-metrica{ background:var(--bg-2); border:1px solid var(--linha); border-radius:12px; padding:16px 18px; }
  .card-metrica .valor{ font-size:28px; font-weight:700; }
  .card-metrica .rotulo{ font-size:12px; color:var(--texto-fraco); margin-top:4px; }
  #view-relatorios h3{ font-size:14px; color:var(--texto-fraco); text-transform:uppercase; letter-spacing:.5px; margin:0 0 12px; }

  /* Dashboard 3D/neon (28/09, pedido Diegão) — cards em degradê com borda
     neon acesa e sombra em relevo (efeito de "flutuar" da tela), separado
     do bloco de métricas simples que já existia (não alterado). Base de
     design registrada no Cérebro Mestre: neon, alto relevo, degradê,
     brilho, animação sutil — reaproveitar em outros painéis/relatórios. */
  #dashboard-avancado h3{ font-size:14px; color:var(--texto-fraco); text-transform:uppercase; letter-spacing:.5px; margin:32px 0 12px; }
  .cards-metricas-neon{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:16px; margin-bottom:8px; }
  .card-neon{
    background:linear-gradient(155deg, #3A2D72 0%, #241A44 100%);
    border:1px solid rgba(94,235,184,0.35); border-radius:16px; padding:18px 20px;
    box-shadow:0 0 0 1px rgba(94,235,184,0.08), 0 0 18px rgba(61,217,160,0.18),
      0 10px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
    transition:box-shadow .2s ease;
  }
  .card-neon:hover{
    box-shadow:0 0 0 1px rgba(94,235,184,0.18), 0 0 26px rgba(61,217,160,0.3),
      0 10px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .card-neon .valor{
    font-size:30px; font-weight:800; color:#5EEBB8;
    text-shadow:0 0 6px rgba(94,235,184,0.7), 0 0 16px rgba(61,217,160,0.4);
  }
  .card-neon .rotulo{ font-size:12px; color:var(--texto-fraco); margin-top:5px; }
  .grid-graficos{ display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:18px; margin-bottom:28px; }
  .card-grafico{
    background:linear-gradient(160deg, #34275F 0%, #211939 100%);
    border:1px solid rgba(155,89,232,0.35); border-radius:16px; padding:18px 20px;
    box-shadow:0 0 0 1px rgba(155,89,232,0.08), 0 0 20px rgba(155,89,232,0.15),
      0 10px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .card-grafico h4{
    margin:0 0 14px; font-size:13px; color:var(--texto); text-transform:uppercase; letter-spacing:.6px;
    text-shadow:0 0 8px rgba(155,89,232,0.6);
  }
  .card-grafico .caixa-canvas{ position:relative; height:230px; }
  .card-grafico.grande{ grid-column:1 / -1; }
  .card-grafico.grande .caixa-canvas{ height:260px; }
  .barra-estagio{ display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:13px; }
  .barra-estagio .rotulo-estagio{ width:150px; flex-shrink:0; text-transform:capitalize; }
  .barra-estagio .trilho{ flex:1; background:rgba(255,255,255,0.06); border-radius:6px; height:10px; overflow:hidden; }
  .barra-estagio .preenchido{ background:var(--verde); height:100%; }
  .barra-estagio .contagem{ width:34px; text-align:right; flex-shrink:0; color:var(--texto-fraco); }

  #resumo-topo-lista{ padding:12px 16px; border-bottom:1px solid var(--linha); font-size:12.5px; color:var(--texto-fraco); background:rgba(255,255,255,0.02); flex-shrink:0; }
  #resumo-topo-lista strong{ color:var(--verde); font-size:15px; }
  #lista-scroll{ flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
  #lista{ background:var(--bg-2); border-right:1px solid var(--linha); overflow-y:auto; display:flex; flex-direction:column; }

  /* Card de lead em "botão neon" (28/09, pedido Diegão) — mesma pegada do
     botão de anexar/enviar do chat.html: fundo em degradê, borda neon
     SEMPRE acesa (não só no hover), sombra em relevo. Hover intensifica o
     brilho, igual lá. Cada lead novo que entra já nasce com essa cara. */
  .item{
    padding:12px 14px; border-radius:12px; cursor:pointer;
    background:linear-gradient(155deg, #3A2D72 0%, #241A44 100%);
    border:1px solid rgba(94,235,184,0.35);
    box-shadow:0 0 6px rgba(61,217,160,0.35), 0 0 14px rgba(61,217,160,0.15),
      inset 0 1px 0 rgba(255,255,255,0.06);
    transition:box-shadow .15s ease, border-color .15s ease, transform .1s ease;
  }
  .item:hover{
    border-color:rgba(94,235,184,0.7);
    box-shadow:0 0 10px rgba(94,235,184,0.7), 0 0 22px rgba(61,217,160,0.4),
      inset 0 1px 0 rgba(255,255,255,0.08);
    transform:translateY(-1px);
  }
  .item:active{ transform:translateY(0); }
  .item.selecionado{
    border-color:var(--verde-forte, #5EEBB8);
    box-shadow:0 0 0 1px rgba(94,235,184,0.5), 0 0 16px rgba(94,235,184,0.6),
      inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .item.precisa-humano{
    border-color:rgba(217,146,44,0.7);
    box-shadow:0 0 8px rgba(217,146,44,0.6), 0 0 18px rgba(217,146,44,0.35),
      inset 0 1px 0 rgba(255,255,255,0.06);
    animation: piscar-neon 1.6s infinite;
  }
  .item.precisa-humano.selecionado{ animation:none; }
  @keyframes piscar-neon{
    0%,100%{ box-shadow:0 0 8px rgba(217,146,44,0.6), 0 0 18px rgba(217,146,44,0.35), inset 0 1px 0 rgba(255,255,255,0.06); }
    50%{ box-shadow:0 0 14px rgba(217,146,44,0.9), 0 0 28px rgba(217,146,44,0.6), inset 0 1px 0 rgba(255,255,255,0.06); }
  }
  .item .nome{ font-size:14px; font-weight:600; }
  .item .hora-item{ float:right; font-size:11px; font-weight:400; color:var(--texto-fraco); }
  .item .estagio{ font-size:11px; text-transform:uppercase; letter-spacing:.4px; margin-top:4px; }
  .estagio.novo{ color:var(--texto-fraco); }
  .estagio.conversando{ color:var(--verde); }
  .estagio.aguardando_humano{ color:var(--laranja); font-weight:700; }
  .estagio.com_humano{ color:var(--laranja); }
  .estagio.aguardando_pagamento, .estagio.aguardando_ativacao{ color:#C9A24B; }
  .estagio.concluido{ color:var(--texto-fraco); text-decoration:line-through; }

  #conversa{ display:flex; flex-direction:column; height:100%; min-height:0; }
  #topo-conversa{ padding:14px 20px; border-bottom:1px solid var(--linha); display:flex; justify-content:space-between; align-items:center; }
  #notas-conversa{ font-size:11.5px; color:var(--texto-fraco); margin-top:3px; font-weight:400; }
  #topo-conversa select{ background:var(--bg-2); color:var(--texto); border:1px solid var(--linha); border-radius:6px; padding:6px 10px; }
  #topo-conversa button{ padding:8px 16px; border-radius:8px; border:none; font-weight:600; cursor:pointer; }
  #btn-toggle-humano.assumir{ background:var(--laranja); color:#2A1B04; }
  #btn-toggle-humano.liberar{ background:var(--verde); color:#0D2B22; }
  #btn-excluir-conversa{ background:transparent; border:1px solid var(--vermelho); color:var(--vermelho); }
  #btn-excluir-conversa:hover{ background:var(--vermelho); color:#fff; }

  #link-exportar-csv{ display:inline-block; margin-top:6px; font-size:11.5px; color:var(--verde); text-decoration:none; }
  #link-exportar-csv:hover{ text-decoration:underline; }

  #msgs{ flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px; }
  .msg{ max-width:70%; padding:9px 13px; border-radius:12px; font-size:14px; }
  .msg .tag{ font-size:10px; color:var(--texto-fraco); text-transform:uppercase; margin-bottom:2px; }
  .msg.lead{ background:#1E2A3A; align-self:flex-start; }
  .msg.ia{ background:#1A2E22; align-self:flex-end; }
  .msg.operador{ background:#3A2A14; align-self:flex-end; }
  .msg a{ color:var(--verde); text-decoration:underline; word-break:break-all; }

  #form-operador{ display:none; padding:14px; gap:10px; border-top:1px solid var(--linha); }
  #form-operador.ativo{ display:flex; }
  #form-operador input{ flex:1; padding:10px 14px; border-radius:8px; border:1px solid var(--linha); background:var(--bg-2); color:var(--texto); }
  #form-operador button{ padding:0 18px; border-radius:8px; border:none; background:var(--laranja); color:#2A1B04; font-weight:600; cursor:pointer; }

  #vazio{ display:flex; height:100%; align-items:center; justify-content:center; color:var(--texto-fraco); }

  @media (max-width: 720px){
    #view-conversas.ativa{ grid-template-columns: 1fr; }
    #view-conversas.ativa.ver-conversa #lista{ display:none; }
    #view-conversas.ativa:not(.ver-conversa) #conversa{ display:none; }
    #btn-voltar-lista{ display:inline-block !important; }
    #topo-conversa{ flex-wrap:wrap; gap:8px; }
  }
  #btn-voltar-lista{ display:none; background:none; border:1px solid var(--linha); color:var(--texto); padding:6px 10px; border-radius:6px; margin-right:8px; cursor:pointer; }
</style>
</head>
<body>

<div id="login">
  <div style="font-size:18px;font-weight:600">Painel Federal Conect</div>
  <input id="input-senha" type="password" placeholder="Senha do operador" />
  <button id="btn-entrar">Entrar</button>
</div>

<div id="app">
  <div id="abas">
    <button id="aba-conversas" class="ativa" type="button">Conversas</button>
    <button id="aba-relatorios" type="button">Relatórios</button>
  </div>
  <div id="view-conversas" class="ativa">
    <div id="lista">
      <div id="resumo-topo-lista">
        <div id="resumo-contador"></div>
        <a id="link-exportar-csv" href="#" target="_blank">⬇️ Exportar leads (CSV/Excel)</a>
      </div>
      <div id="lista-scroll"></div>
    </div>
    <div id="conversa">
      <div id="vazio">Selecione uma conversa à esquerda</div>
    </div>
  </div>
  <div id="view-relatorios"></div>
</div>

<script>
  let ws = null;
  let conversas = [];
  let selecionada = null;
  let senhaAtual = null;
  // Rascunho do que o operador tá digitando pra cada conversa, guardado em
  // memória (sobrevive a trocar de conversa e voltar, ou a lista atualizar
  // sozinha — sem isso o texto digitado sumia toda vez que montarPainel()
  // reconstruía o formulário do zero).
  const rascunhos = {};

  document.getElementById('btn-entrar').addEventListener('click', () => entrar(false));
  document.getElementById('input-senha').addEventListener('keydown', (e) => { if(e.key === 'Enter') entrar(false); });

  // Export CSV manda a senha no header X-Senha (não na URL, que vai pros
  // logs do Render) e baixa o arquivo via blob.
  document.getElementById('link-exportar-csv').addEventListener('click', async (e) => {
    e.preventDefault();
    const r = await fetch('/exportar-leads.csv', {headers: {'X-Senha': senhaAtual || ''}});
    if(!r.ok){ alert('Não foi possível exportar os leads.'); return; }
    const url = URL.createObjectURL(await r.blob());
    const a = document.createElement('a');
    a.href = url;
    a.download = 'leads_federal_connect.csv';
    a.click();
    URL.revokeObjectURL(url);
  });

  // --- Abas Conversas / Relatórios ---
  document.getElementById('aba-conversas').addEventListener('click', () => trocarAba('conversas'));
  document.getElementById('aba-relatorios').addEventListener('click', () => trocarAba('relatorios'));

  function trocarAba(aba){
    document.getElementById('aba-conversas').classList.toggle('ativa', aba === 'conversas');
    document.getElementById('aba-relatorios').classList.toggle('ativa', aba === 'relatorios');
    document.getElementById('view-conversas').classList.toggle('ativa', aba === 'conversas');
    document.getElementById('view-relatorios').classList.toggle('ativa', aba === 'relatorios');
    if(aba === 'relatorios') renderRelatorios();
  }

  // Rótulos amigáveis pros estágios, na ordem em que aparecem no relatório.
  const ROTULOS_ESTAGIO = {
    novo: 'Novo', conversando: 'Conversando', aguardando_humano: 'Aguardando humano',
    com_humano: 'Com humano', aguardando_pagamento: 'Aguardando pagamento',
    aguardando_ativacao: 'Aguardando ativação', concluido: 'Concluído',
  };

  function renderRelatorios(){
    const el = document.getElementById('view-relatorios');
    const total = conversas.length;
    const hojeStr = new Date().toDateString();
    const leadsHoje = conversas.filter(c => c.criada_em && new Date(c.criada_em * 1000).toDateString() === hojeStr).length;
    const concluidos = conversas.filter(c => c.estagio === 'concluido').length;
    const comHumano = conversas.filter(c => c.humano_ativo).length;
    const taxaFechamento = total ? Math.round((concluidos / total) * 100) : 0;

    const porEstagio = {};
    Object.keys(ROTULOS_ESTAGIO).forEach(e => porEstagio[e] = 0);
    conversas.forEach(c => { porEstagio[c.estagio] = (porEstagio[c.estagio] || 0) + 1; });
    const maiorContagem = Math.max(1, ...Object.values(porEstagio));

    el.innerHTML = `
      <div class="cards-metricas">
        <div class="card-metrica"><div class="valor">${total}</div><div class="rotulo">Leads no total</div></div>
        <div class="card-metrica"><div class="valor">${leadsHoje}</div><div class="rotulo">Novos leads hoje</div></div>
        <div class="card-metrica"><div class="valor">${taxaFechamento}%</div><div class="rotulo">Taxa de fechamento (concluído/total)</div></div>
        <div class="card-metrica"><div class="valor">${comHumano}</div><div class="rotulo">Conversas com humano agora</div></div>
      </div>
      <h3>Leads por estágio</h3>
      ${Object.keys(ROTULOS_ESTAGIO).map(e => `
        <div class="barra-estagio">
          <div class="rotulo-estagio">${ROTULOS_ESTAGIO[e]}</div>
          <div class="trilho"><div class="preenchido" style="width:${(porEstagio[e] / maiorContagem) * 100}%"></div></div>
          <div class="contagem">${porEstagio[e]}</div>
        </div>
      `).join('')}
      <div id="dashboard-avancado"></div>
    `;
    renderDashboardAvancado(porEstagio);
  }

  // --- Dashboard avançado (28/09, pedido Diegão) — gráficos em cima do que
  // já existia acima, sem alterar nada do bloco de cima. ---

  // Leads "qualificados" (proxy, 28/09): não existe flag explícita de
  // qualificação nos dados — usamos "já passou da etapa de pagamento" como
  // aproximação de lead qualificado (chegou perto o suficiente da compra).
  const ESTAGIOS_QUALIFICADO = ['aguardando_pagamento', 'aguardando_ativacao', 'concluido'];

  function diaCurtoISO(ts){
    const d = new Date(ts * 1000);
    return d.toISOString().slice(0, 10); // YYYY-MM-DD, agrupa por dia
  }
  function diaRotulo(isoStr){
    const [ano, mes, dia] = isoStr.split('-');
    return `${dia}/${mes}`;
  }

  let chartPizza = null, chartDias = null, chartAscensao = null;

  function renderDashboardAvancado(porEstagio){
    const container = document.getElementById('dashboard-avancado');
    if(!container) return;

    const qualificados = conversas.filter(c => ESTAGIOS_QUALIFICADO.includes(c.estagio)).length;

    // Tempo médio até concluir (proxy: última mensagem - criação, só de
    // quem já está "concluido" — não existe timestamp exato de conclusão
    // guardado, então usamos a última atualização como aproximação).
    const concluidosComTempo = conversas.filter(c => c.estagio === 'concluido' && c.criada_em && c.ultima_mensagem_em);
    let tempoMedioTexto = '—';
    if(concluidosComTempo.length){
      const mediaSegundos = concluidosComTempo.reduce((soma, c) => soma + (c.ultima_mensagem_em - c.criada_em), 0) / concluidosComTempo.length;
      const horas = mediaSegundos / 3600;
      tempoMedioTexto = horas < 1 ? `${Math.round(mediaSegundos / 60)} min` : `${horas.toFixed(1)} h`;
    }

    // Leads por dia — últimos 14 dias corridos (hoje incluso).
    const HOJE = new Date();
    const dias = [];
    for(let i = 13; i >= 0; i--){
      const d = new Date(HOJE);
      d.setDate(d.getDate() - i);
      dias.push(d.toISOString().slice(0, 10));
    }
    const porDia = {};
    dias.forEach(d => porDia[d] = 0);
    conversas.forEach(c => {
      if(!c.criada_em) return;
      const dia = diaCurtoISO(c.criada_em);
      if(dia in porDia) porDia[dia]++;
    });
    const valoresPorDia = dias.map(d => porDia[d]);
    const acumulado = [];
    valoresPorDia.reduce((soma, v, i) => { acumulado[i] = soma + v; return acumulado[i]; }, 0);

    container.innerHTML = `
      <h3>📊 Métricas avançadas</h3>
      <div class="cards-metricas-neon">
        <div class="card-neon"><div class="valor">${qualificados}</div><div class="rotulo">Leads qualificados (chegaram no pagamento+)</div></div>
        <div class="card-neon"><div class="valor">${tempoMedioTexto}</div><div class="rotulo">Tempo médio até concluir</div></div>
        <div class="card-neon"><div class="valor">${valoresPorDia[valoresPorDia.length - 1]}</div><div class="rotulo">Leads hoje (gráfico)</div></div>
        <div class="card-neon"><div class="valor">${acumulado[acumulado.length - 1]}</div><div class="rotulo">Acumulado (14 dias)</div></div>
      </div>
      <div class="grid-graficos">
        <div class="card-grafico">
          <h4>Leads por estágio</h4>
          <div class="caixa-canvas"><canvas id="grafico-pizza"></canvas></div>
        </div>
        <div class="card-grafico">
          <h4>Leads por dia (últimos 14 dias)</h4>
          <div class="caixa-canvas"><canvas id="grafico-dias"></canvas></div>
        </div>
        <div class="card-grafico grande">
          <h4>Ascensão — leads acumulados</h4>
          <div class="caixa-canvas"><canvas id="grafico-ascensao"></canvas></div>
        </div>
      </div>
    `;

    if(typeof Chart === 'undefined') return; // CDN do Chart.js não carregou (offline?) — resto do painel segue normal

    const CORES_ESTAGIO = {
      novo: '#8B7FB8', conversando: '#3DD9A0', aguardando_humano: '#D9922C',
      com_humano: '#E0A93D', aguardando_pagamento: '#C9A24B',
      aguardando_ativacao: '#5EEBB8', concluido: '#6A3FC0',
    };
    const rotulosEstagio = Object.keys(ROTULOS_ESTAGIO).map(e => ROTULOS_ESTAGIO[e]);
    const valoresEstagio = Object.keys(ROTULOS_ESTAGIO).map(e => porEstagio[e] || 0);
    const coresEstagio = Object.keys(ROTULOS_ESTAGIO).map(e => CORES_ESTAGIO[e]);

    const opcoesComuns = {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#F3F1FA', font: { size: 11 } } } },
    };
    const eixosComGrid = {
      x: { ticks: { color: '#BDB0DE', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
      y: { ticks: { color: '#BDB0DE', font: { size: 10 }, precision: 0 }, grid: { color: 'rgba(255,255,255,0.05)' }, beginAtZero: true },
    };

    if(chartPizza) chartPizza.destroy();
    chartPizza = new Chart(document.getElementById('grafico-pizza'), {
      type: 'doughnut',
      data: { labels: rotulosEstagio, datasets: [{ data: valoresEstagio, backgroundColor: coresEstagio, borderColor: '#211939', borderWidth: 2 }] },
      options: { ...opcoesComuns, plugins: { ...opcoesComuns.plugins, legend: { ...opcoesComuns.plugins.legend, position: 'bottom' } } },
    });

    if(chartDias) chartDias.destroy();
    chartDias = new Chart(document.getElementById('grafico-dias'), {
      type: 'bar',
      data: { labels: dias.map(diaRotulo), datasets: [{ label: 'Leads', data: valoresPorDia, backgroundColor: '#5EEBB8', borderRadius: 4 }] },
      options: { ...opcoesComuns, plugins: { legend: { display: false } }, scales: eixosComGrid },
    });

    if(chartAscensao) chartAscensao.destroy();
    chartAscensao = new Chart(document.getElementById('grafico-ascensao'), {
      type: 'line',
      data: {
        labels: dias.map(diaRotulo),
        datasets: [{
          label: 'Leads acumulados', data: acumulado, borderColor: '#9B59E8', backgroundColor: 'rgba(155,89,232,0.18)',
          fill: true, tension: 0.35, pointBackgroundColor: '#5EEBB8', pointRadius: 3,
        }],
      },
      options: { ...opcoesComuns, plugins: { legend: { display: false } }, scales: eixosComGrid },
    });
  }

  // Guarda a senha no localStorage pra sobreviver a um F5 na página — antes
  // disso, todo refresh derrubava o WebSocket e, sem senha guardada em
  // lugar nenhum, o painel sempre voltava pra tela de login (queixa do
  // Diegão: "quando eu atualizo a página, ela sai do login").
  const CHAVE_SENHA = 'federal_painel_senha';

  // Heartbeat (27/09): no celular a conexão morre calada (tela bloqueada,
  // troca de rede) e o painel seguia mostrando a lista velha, com clique
  // indo pro vazio. Ping a cada 20s; 50s sem nenhum sinal do servidor =
  // conexão morta, reconecta. Voltar pro app também confere e reconecta.
  let ultimoSinal = Date.now();
  setInterval(() => {
    if(!ws || !localStorage.getItem(CHAVE_SENHA)) return;
    if(ws.readyState !== 1 || Date.now() - ultimoSinal > 50000){ entrar(true); return; }
    ws.send(JSON.stringify({acao:'ping'}));
  }, 20000);
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState !== 'visible' || !ws || !localStorage.getItem(CHAVE_SENHA)) return;
    if(ws.readyState !== 1 || Date.now() - ultimoSinal > 25000) entrar(true);
    else ws.send(JSON.stringify({acao:'ping'}));
  });

  function entrar(silencioso){
    const senha = silencioso ? localStorage.getItem(CHAVE_SENHA) : document.getElementById('input-senha').value;
    if(!senha) return;
    senhaAtual = senha;
    const protocolo = location.protocol === 'https:' ? 'wss' : 'ws';
    // Senha vai como 1ª mensagem, não na URL — URL fica gravada em texto
    // puro nos logs de acesso do Render (achado no incidente de 27/09).
    if(ws && ws.readyState <= 1){ try{ ws.close(); }catch(e){} }
    ws = new WebSocket(`${protocolo}://${location.host}/ws/painel`);
    const esteWs = ws;
    let autenticado = false;

    ws.onopen = () => {
      ws.send(JSON.stringify({acao:'auth', senha}));
    };
    // Só entra no painel quando o servidor responde (senha aceita) — senha
    // errada fecha a conexão antes de qualquer mensagem chegar.
    ws.addEventListener('message', () => {
      ultimoSinal = Date.now();
      if(autenticado) return;
      autenticado = true;
      localStorage.setItem(CHAVE_SENHA, senha);
      document.getElementById('login').style.display = 'none';
      document.getElementById('app').classList.add('ativo');
      // Reconectou com uma conversa aberta: recarrega o histórico dela.
      if(selecionada) esteWs.send(JSON.stringify({acao:'abrir', session_id: selecionada}));
    });
    ws.onclose = (ev) => {
      if(esteWs !== ws) return; // conexão antiga, já substituída
      // Conexão que já estava logada caiu (celular bloqueou, trocou de
      // rede, deploy): reconecta sozinho em vez de largar o painel parado
      // com a lista velha na tela e clique indo pro vazio (27/09).
      if(autenticado && localStorage.getItem(CHAVE_SENHA)){
        setTimeout(() => { if(esteWs === ws) entrar(true); }, 1500);
        return;
      }
      // Caiu antes de logar = senha errada (o 4001 às vezes chega sem
      // código pelo proxy do Render) — não fica em loop tentando.
      localStorage.removeItem(CHAVE_SENHA);
      if(!silencioso) alert(ev.code === 4001 ? 'Senha incorreta.' : 'Não foi possível entrar. Confira a senha e tente de novo.');
      document.getElementById('login').style.display = 'flex';
      document.getElementById('app').classList.remove('ativo');
    };
    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if(data.type === 'lista'){
        conversas = data.conversas;
        // Se a conversa aberta foi excluída (por mim ou por outro operador
        // em outra sessão), volta o painel pro estado vazio em vez de ficar
        // mostrando uma conversa fantasma que não existe mais.
        if(selecionada && !conversas.find(c => c.session_id === selecionada)){
          selecionada = null;
          delete rascunhos[selecionada];
          document.getElementById('conversa').innerHTML = '<div id="vazio">Selecione uma conversa à esquerda</div>';
          document.getElementById('view-conversas').classList.remove('ver-conversa');
        }
        renderLista();
        // Antes, uma atualização de lista (ex: clicar "Assumir conversa")
        // só atualizava a barra lateral — o painel da conversa aberta não
        // sabia que agora tinha um humano ativo, então o botão e a caixa
        // de digitar pro operador nunca apareciam. Aqui a gente atualiza
        // só o cabeçalho/botão/formulário do painel aberto, sem apagar as
        // mensagens já carregadas.
        atualizarPainelSelecionado();
        // Se a aba de Relatórios estiver aberta, mantém as métricas ao vivo.
        if(document.getElementById('view-relatorios').classList.contains('ativa')) renderRelatorios();
      } else if(data.type === 'historico' && data.session_id === selecionada){
        const msgs = document.getElementById('msgs');
        if(msgs){
          msgs.innerHTML = '';
          data.mensagens.forEach(m => renderMensagemNova(m.remetente, m.texto));
        }
      } else if(data.type === 'mensagem' && data.session_id === selecionada){
        renderMensagemNova(data.remetente, data.texto);
      }
    };
  }

  const TITULO_ORIGINAL = document.title;
  let piscaTitulo = null;

  function renderLista(){
    const el = document.getElementById('lista-scroll');
    el.innerHTML = '';
    // Quem precisa de humano vai pro topo da lista, sempre — o operador não
    // pode ter que rolar pra baixo procurando o lead que tá esperando.
    const ordenadas = [...conversas].sort((a, b) => {
      const aUrgente = a.estagio === 'aguardando_humano' ? 0 : 1;
      const bUrgente = b.estagio === 'aguardando_humano' ? 0 : 1;
      if(aUrgente !== bUrgente) return aUrgente - bUrgente;
      return (b.ultima_mensagem_em || 0) - (a.ultima_mensagem_em || 0);
    });
    ordenadas.forEach(c => {
      const urgente = c.estagio === 'aguardando_humano';
      const div = document.createElement('div');
      div.className = 'item' + (c.session_id === selecionada ? ' selecionado' : '') + (urgente ? ' precisa-humano' : '');
      const nome = c.lead_name || ('Lead ' + c.session_id.slice(0,8));
      const rotuloEstagio = urgente ? '🚨 Precisa de atendimento humano' : c.estagio.replace(/_/g,' ');
      div.innerHTML = `<div class="nome">${nome}<span class="hora-item">${horaCurta(c.ultima_mensagem_em)}</span></div><div class="estagio ${c.estagio}">${rotuloEstagio}</div>`;
      div.addEventListener('click', () => selecionar(c.session_id));
      el.appendChild(div);
    });
    atualizarResumoTopoLista();
    atualizarAlertaTitulo();
  }

  // Pisca o título da aba do navegador quando tem lead esperando humano —
  // pra quem tá de olho em outra aba/janela perceber sem precisar ficar
  // checando o painel toda hora.
  function atualizarAlertaTitulo(){
    const pendentes = conversas.filter(c => c.estagio === 'aguardando_humano').length;
    if(pendentes > 0){
      if(!piscaTitulo){
        let mostrarAlerta = true;
        piscaTitulo = setInterval(() => {
          document.title = mostrarAlerta ? `🚨 (${pendentes}) precisa de atendimento!` : TITULO_ORIGINAL;
          mostrarAlerta = !mostrarAlerta;
        }, 1500);
      }
    } else if(piscaTitulo){
      clearInterval(piscaTitulo);
      piscaTitulo = null;
      document.title = TITULO_ORIGINAL;
    }
  }

  // Contador de "leads hoje" direto na aba Conversas — antes só existia
  // escondido dentro da aba Relatórios, e o operador (Sandro/Diegão) tem que
  // ver isso de cara sem precisar trocar de aba.
  function atualizarResumoTopoLista(){
    const el = document.getElementById('resumo-contador');
    if(!el) return;
    const hojeStr = new Date().toDateString();
    const leadsHoje = conversas.filter(c => c.criada_em && new Date(c.criada_em * 1000).toDateString() === hojeStr).length;
    el.innerHTML = `<strong>${leadsHoje}</strong> lead${leadsHoje === 1 ? '' : 's'} novo${leadsHoje === 1 ? '' : 's'} hoje &nbsp;·&nbsp; ${conversas.length} no total`;
  }

  const ESTAGIOS = ['novo','conversando','aguardando_humano','com_humano','aguardando_pagamento','aguardando_ativacao','concluido'];

  function selecionar(sessionId){
    salvarRascunhoAtual();
    selecionada = sessionId;
    renderLista();
    document.getElementById('view-conversas').classList.add('ver-conversa');
    montarPainel(sessionId, { comHistorico: true });
  }

  // Monta o painel inteiro (cabeçalho + mensagens vazias + form). Só é
  // chamado quando o operador clica numa conversa (uma vez). Atualizações
  // depois disso (ex: outro operador assumiu, IA mudou estágio) passam por
  // atualizarPainelSelecionado(), que NÃO reconstrói #msgs.
  function montarPainel(sessionId, opcoes){
    const c = conversas.find(x => x.session_id === sessionId);
    if(!c) return;
    const painel = document.getElementById('conversa');
    const humanoAtivo = c.humano_ativo;
    painel.innerHTML = `
      <div id="topo-conversa">
        <button id="btn-voltar-lista" type="button">&larr; Conversas</button>
        <div>
          <div id="titulo-conversa">${tituloConversa(c)}</div>
          <div id="notas-conversa">${notasELinha(c)}</div>
        </div>
        <div>
          <select id="select-estagio">
            ${ESTAGIOS.map(e => `<option value="${e}" ${e===c.estagio?'selected':''}>${e.replace(/_/g,' ')}</option>`).join('')}
          </select>
          <button id="btn-toggle-humano" class="${humanoAtivo ? 'liberar' : 'assumir'}">${humanoAtivo ? 'Devolver pra IA' : 'Assumir conversa'}</button>
          <button id="btn-excluir-conversa" type="button" title="Excluir esta conversa">🗑️ Excluir</button>
        </div>
      </div>
      <div id="msgs"></div>
      <div id="resumo-encerramento">${c.resumo_encerramento ? `📋 ${c.resumo_encerramento}` : ''}</div>
      <form id="form-operador" class="${humanoAtivo ? 'ativo' : ''}">
        <input id="input-operador" placeholder="Digite pra responder o lead diretamente..." autocomplete="off" value="${rascunhoEscapado(sessionId)}" />
        <button type="submit">Enviar</button>
      </form>
    `;
    ligarEventosPainel(sessionId);
    document.getElementById('btn-voltar-lista').addEventListener('click', () => {
      document.getElementById('view-conversas').classList.remove('ver-conversa');
    });
    if(opcoes && opcoes.comHistorico){
      // Carrega o histórico da conversa (sem isso, abrir uma conversa em
      // andamento aparecia vazia, dando impressão de painel quebrado).
      // Conexão fechada: reconecta, e a reconexão já pede o histórico.
      if(ws && ws.readyState === 1) ws.send(JSON.stringify({acao:'abrir', session_id: sessionId}));
      else entrar(true);
    }
  }

  function tituloConversa(c){
    const nome = c.lead_name || ('Lead ' + c.session_id.slice(0,8));
    const telefone = c.lead_phone ? ` · 📱 ${c.lead_phone}` : '';
    return `${nome}${telefone} — <span class="estagio ${c.estagio}">${c.estagio.replace(/_/g,' ')}</span>`;
  }

  // Horário (27/09, pedido Diegão): hoje mostra só HH:MM, outro dia mostra
  // DD/MM HH:MM. Timestamps vêm em segundos (time.time() do servidor).
  function horaCurta(ts){
    if(!ts) return '';
    const d = new Date(ts * 1000);
    const hhmm = d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
    if(d.toDateString() === new Date().toDateString()) return hhmm;
    return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'}) + ' ' + hhmm;
  }

  function notasELinha(c){
    const partes = [];
    partes.push(`🕒 início ${horaCurta(c.criada_em)} · última ${horaCurta(c.ultima_mensagem_em)}`);
    if(c.lead_origem) partes.push('📍 ' + c.lead_origem);
    if(c.lead_notes) partes.push('📝 ' + c.lead_notes);
    return partes.join(' &nbsp;·&nbsp; ');
  }

  function ligarEventosPainel(sessionId){
    document.getElementById('select-estagio').addEventListener('change', (e) => {
      ws.send(JSON.stringify({acao:'mudar_estagio', session_id: sessionId, estagio: e.target.value}));
    });
    document.getElementById('btn-toggle-humano').addEventListener('click', (e) => {
      const acao = e.target.classList.contains('liberar') ? 'liberar_para_ia' : 'assumir';
      ws.send(JSON.stringify({acao, session_id: sessionId}));
    });
    document.getElementById('btn-excluir-conversa').addEventListener('click', () => {
      const c = conversas.find(x => x.session_id === sessionId);
      const nome = c ? (c.lead_name || ('Lead ' + sessionId.slice(0,8))) : sessionId;
      if(!confirm(`Excluir a conversa de "${nome}" pra sempre? Isso apaga o histórico e não pode ser desfeito.`)) return;
      ws.send(JSON.stringify({acao:'excluir', session_id: sessionId}));
      delete rascunhos[sessionId];
    });
    const form = document.getElementById('form-operador');
    const input = document.getElementById('input-operador');
    input.addEventListener('input', () => {
      rascunhos[sessionId] = input.value;
    });
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const texto = input.value.trim();
      if(!texto) return;
      ws.send(JSON.stringify({acao:'mensagem', session_id: sessionId, texto}));
      renderMensagemNova('operador', texto);
      input.value = '';
      delete rascunhos[sessionId];
    });
  }

  // Chamado antes de trocar de conversa (selecionar) — pega o que tá no
  // campo de texto AGORA (pode não ter disparado o evento 'input' ainda
  // dependendo do navegador) e guarda associado à conversa que tava aberta.
  function salvarRascunhoAtual(){
    if(!selecionada) return;
    const input = document.getElementById('input-operador');
    if(!input) return;
    if(input.value) rascunhos[selecionada] = input.value;
    else delete rascunhos[selecionada];
  }

  function rascunhoEscapado(sessionId){
    const texto = rascunhos[sessionId] || '';
    return texto.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
  }

  // Atualiza cabeçalho/botão/select/form do painel ABERTO sem apagar as
  // mensagens — chamado toda vez que chega uma "lista" nova do servidor
  // (ex: depois de clicar Assumir, a conversa muda de estado e o painel
  // precisa refletir isso na hora, sem precisar reclicar na conversa).
  function atualizarPainelSelecionado(){
    if(!selecionada) return;
    const topo = document.getElementById('topo-conversa');
    if(!topo) return; // painel ainda não foi montado (estado "vazio")
    const c = conversas.find(x => x.session_id === selecionada);
    if(!c) return;

    const titulo = document.getElementById('titulo-conversa');
    if(titulo) titulo.innerHTML = tituloConversa(c);

    const notas = document.getElementById('notas-conversa');
    if(notas) notas.innerHTML = notasELinha(c);

    const select = document.getElementById('select-estagio');
    if(select && select.value !== c.estagio) select.value = c.estagio;

    const btn = document.getElementById('btn-toggle-humano');
    if(btn){
      const deveSerLiberar = c.humano_ativo;
      const eraLiberar = btn.classList.contains('liberar');
      if(deveSerLiberar !== eraLiberar){
        btn.textContent = deveSerLiberar ? 'Devolver pra IA' : 'Assumir conversa';
        btn.className = deveSerLiberar ? 'liberar' : 'assumir';
      }
    }

    const form = document.getElementById('form-operador');
    if(form) form.classList.toggle('ativo', c.humano_ativo);

    const resumo = document.getElementById('resumo-encerramento');
    if(resumo) resumo.textContent = c.resumo_encerramento ? `📋 ${c.resumo_encerramento}` : '';
  }

  // Mesmo fix do chat.html: escapa HTML e transforma URLs em link clicável
  // (target=_blank) — antes disso vinha como texto puro no painel também.
  function formatarMensagem(texto){
    if(!texto) return '';
    const escapado = texto
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
    // Mesmo fix do chat.html: *negrito* estilo WhatsApp vira <b>, e quebra
    // de linha vira <br> — antes disso o painel mostrava tudo cru, um em
    // cima do outro, com os asteriscos literais (era a mesma falha do
    // chat.html, só que aqui nem \n virava <br>).
    const comNegrito = escapado.replace(/\*([^\n*]+)\*/g, '<b>$1</b>');
    const comLinks = comNegrito.replace(
      /(https?:\/\/[^\s<]+)/g,
      '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
    );
    return comLinks.replace(/\n/g, '<br>');
  }

  // Rótulo de quem falou (27/09, pedido Diegão): "IA Federal" em vez de
  // "ia", e o nome do lead (quando a IA já capturou) em vez de "lead".
  function rotuloRemetente(remetente){
    if(remetente === 'ia') return 'IA Federal Connect';
    if(remetente === 'operador') return 'Operador';
    const c = conversas.find(x => x.session_id === selecionada);
    const nome = (c && c.lead_name) || 'Lead';
    return nome.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderMensagemNova(remetente, texto){
    const msgs = document.getElementById('msgs');
    if(!msgs) return;
    const div = document.createElement('div');
    div.className = 'msg ' + remetente;
    div.innerHTML = `<div class="tag">${rotuloRemetente(remetente)}</div>${formatarMensagem(texto)}`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  // Ao carregar a página (inclusive num F5), tenta reconectar sozinho com a
  // senha já salva antes de mostrar a tela de login — só cai no login de
  // verdade se não tiver senha salva ou se ela não for mais válida.
  // Fica no FIM do script de propósito: chamado lá em cima (antes de
  // `const CHAVE_SENHA` / `let piscaTitulo` existirem) dava ReferenceError
  // e matava o resto do script — o painel não listava conversa nenhuma
  // (causa do "sumiram as conversas do painel", 27/09).
  entrar(true);
</script>

</body>
